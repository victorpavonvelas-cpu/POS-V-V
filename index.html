<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abarrotes V&V</title>
    <!-- Libreria para leer Codigos de Barras -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Libreria para generar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #064e3b;      /* Verde Oscuro Fondo */
            --accent: #4ade80;       /* Verde Claro Letras */
            --card-bg: #065f46;      /* Verde Medio Tarjetas */
            --white: #ffffff;
            --danger: #ef4444;
            --input-bg: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--primary);
            color: var(--accent);
            font-size: 16px;
            min-height: 100vh;
            padding-bottom: 80px; /* Espacio para el menu inferior */
            display: flex;
            flex-direction: column;
        }

        /* --- ENCABEZADO --- */
        .app-header {
            text-align: center;
            padding: 1rem;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent);
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--white);
        }

        /* --- MENU INFERIOR --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 0.8rem 0;
            border-top: 2px solid var(--accent);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .nav-icon { font-size: 1.5rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--white); transform: translateY(-2px); }

        /* --- CONTENIDO --- */
        main { padding: 1rem; flex: 1; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
        }

        h2 {
            border-bottom: 2px dashed var(--accent);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: var(--white);
        }

        label { display: block; margin-bottom: 0.4rem; font-size: 0.95rem; font-weight: bold; }
        input, select {
            width: 100%; padding: 12px; border: 2px solid var(--accent); border-radius: 10px;
            font-size: 1rem; background-color: var(--white); color: #000; margin-bottom: 0.8rem;
        }

        .btn {
            display: block; width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            margin-top: 0.5rem; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn:active { transform: translateY(2px); box-shadow: none; }

        .btn-primary { background-color: var(--accent); color: var(--primary); }
        .btn-success { background-color: var(--white); color: var(--primary); font-size: 1.3rem; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-camera { background-color: #3b82f6; color: white; margin-bottom: 0.5rem; }
        .btn-pdf { background-color: #dc2626; color: white; }

        .table-responsive { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; background: #fff; color: #000; min-width: 500px; }
        th { background-color: #d1fae5; color: var(--primary); padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        
        #scanner-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #reader { width: 90%; max-width: 400px; border-radius: 10px; overflow: hidden; }
        
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 3000; width: 90%; max-width: 300px; }
        .toast {
            background: #fff; color: #000; padding: 12px; border-radius: 8px; margin-bottom: 10px;
            border-left: 5px solid var(--accent); font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .toast.error { border-left-color: var(--danger); }

        .grid-2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .dropdown {
            position: absolute; background: #fff; width: 100%; border-radius: 0 0 10px 10px; z-index: 100;
            display: none; border: 1px solid var(--accent); border-top: none; max-height: 200px; overflow-y: auto;
        }
        .dropdown-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; color: var(--primary); }
        .dropdown-item:hover { background: #f0fdf4; }

        .total-box {
            background: #fff; color: var(--primary); padding: 1.5rem; border-radius: 16px;
            text-align: center; border: 4px solid var(--accent); margin-bottom: 1rem;
        }
        .total-price { font-size: 2.5rem; font-weight: 900; }

    </style>
</head>
<body>

    <!-- APP PRINCIPAL -->
    <div id="app-content">
        
        <div class="app-header">
            <h1>Abarrotes V&V</h1>
            <small style="color: var(--accent);">Sistema Unificado</small>
        </div>

        <main>
            <!-- SECCION 1: CAJA (POS) -->
            <section id="view-pos" class="view-section active">
                <div class="card">
                    <h2>Cobrar</h2>
                    <button onclick="startScanner('pos')" class="btn btn-camera">Camara del Celular</button>
                    
                    <div style="position: relative;">
                        <label>O buscar producto:</label>
                        <input type="text" id="pos-input" placeholder="Escribe nombre o codigo..." autocomplete="off">
                        <ul id="pos-dropdown" class="dropdown"></ul>
                    </div>
                </div>

                <div class="card">
                    <h2>Carrito</h2>
                    <div class="table-responsive">
                        <table id="cart-table">
                            <thead><tr><th>Prod</th><th>Cant</th><th>Total</th><th>X</th></tr></thead>
                            <tbody id="cart-body"></tbody>
                        </table>
                    </div>
                    <div id="empty-cart-msg" style="text-align:center; padding:1rem; color:#aaa;">Carrito Vacio</div>
                </div>

                <div class="total-box">
                    <small>TOTAL A PAGAR</small>
                    <div class="total-price" id="pos-total">$0.00</div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="processSale()" class="btn btn-success" style="flex: 2;">COBRAR</button>
                    <button onclick="clearCart()" class="btn btn-danger" style="flex: 1;">X</button>
                </div>
            </section>

            <!-- SECCION 2: INVENTARIO -->
            <section id="view-inventory" class="view-section">
                <div class="card">
                    <h2>Agregar Producto</h2>
                    <form id="inventory-form">
                        <label>Nombre</label>
                        <input type="text" id="prod-name" placeholder="Ej. Galletas" required>
                        
                        <div style="display: flex; gap: 5px; align-items: flex-start;">
                            <div style="flex:1">
                                <label>Codigo</label>
                                <input type="text" id="prod-barcode" placeholder="Escanear" required style="margin-bottom: 0;">
                            </div>
                            <button type="button" onclick="startScanner('inventory')" class="btn" style="padding: 0 15px; margin-top: 1.5rem; width: auto;">Camara</button>
                        </div>
                        
                        <div class="grid-2">
                            <div>
                                <label>Precio</label>
                                <input type="number" id="prod-price" step="0.01" placeholder="0.00" required>
                            </div>
                            <div>
                                <label>Stock</label>
                                <input type="number" id="prod-stock" placeholder="0" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </div>

                <div class="card">
                    <h2>Inventario Global</h2>
                    <input type="text" id="inv-search" placeholder="Buscar en inventario..." onkeyup="renderInventory()">
                    
                    <div class="table-responsive">
                        <table id="inventory-table">
                            <thead><tr><th>Prod</th><th>Cod</th><th>$</th><th>Stock</th><th></th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- SECCION 3: REPORTES -->
            <section id="view-reports" class="view-section">
                <div class="card" style="text-align:center;">
                    <h2>Corte de Ventas</h2>
                    
                    <!-- Selector de fecha -->
                    <label>Tipo de Reporte:</label>
                    <select id="report-type" onchange="renderReports()">
                        <option value="today">Diario (Hoy)</option>
                        <option value="week">Semanal (Ultimos 7 dias)</option>
                        <option value="month">Mensual (Este mes)</option>
                        <option value="year">Anual (Este año)</option>
                    </select>

                    <p id="report-date" style="color: var(--accent); font-weight: bold; margin-top: 1rem;"></p>
                    
                    <div style="background: #fff; padding: 2rem; border-radius: 20px; margin: 1rem 0; color: var(--primary);">
                        <div>Ventas Totales: <span id="report-count" style="font-size: 1.5rem;">0</span></div>
                        <div style="font-size: 2.5rem; font-weight: 900;" id="report-total">$0.00</div>
                    </div>

                    <div style="display: flex; gap: 10px; flex-direction: column;">
                        <button onclick="downloadPDF()" class="btn btn-pdf">📄 Descargar Reporte PDF</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- MENU INFERIOR -->
        <nav class="bottom-nav">
            <div onclick="switchView('pos')" id="nav-pos" class="nav-item active">
                <span class="nav-icon">💰</span>
                <span>Vender</span>
            </div>
            <div onclick="switchView('inventory')" id="nav-inventory" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>Inventario</span>
            </div>
            <div onclick="switchView('reports')" id="nav-reports" class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Corte</span>
            </div>
        </nav>

    </div>

    <!-- MODAL CAMARA -->
    <div id="scanner-modal">
        <div id="reader"></div>
        <div style="margin-top: 1rem; width: 80%; max-width: 400px;">
            <button onclick="stopScanner()" class="btn btn-danger">Cerrar Camara</button>
        </div>
    </div>

    <!-- NOTIFICACIONES -->
    <div id="toast-container"></div>

    <script>
        // --- ESTADO GLOBAL ---
        const GLOBAL_INV_KEY = 'vv_global_inventory';
        const GLOBAL_SALES_KEY = 'vv_global_sales';
        
        let inventory = [];
        let salesHistory = [];
        let cart = [];
        let html5QrCode;
        let scanContext = '';

        // --- INICIALIZACION ---
        window.onload = function() {
            loadGlobalData();
        };

        function loadGlobalData() {
            const invData = localStorage.getItem(GLOBAL_INV_KEY);
            const salesData = localStorage.getItem(GLOBAL_SALES_KEY);
            
            inventory = invData ? JSON.parse(invData) : [];
            salesHistory = salesData ? JSON.parse(salesData) : [];

            if (inventory.length === 0) {
                inventory = [
                    { id: 1, name: 'Coca Cola', barcode: '1', price: 20, stock: 10 },
                    { id: 2, name: 'Galletas', barcode: '2', price: 12, stock: 20 }
                ];
                saveGlobalData();
            }
            renderInventory();
            renderReports();
        }

        function saveGlobalData() {
            localStorage.setItem(GLOBAL_INV_KEY, JSON.stringify(inventory));
            localStorage.setItem(GLOBAL_SALES_KEY, JSON.stringify(salesHistory));
        }

        // --- UTILIDADES ---
        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`; t.innerText = msg;
            c.appendChild(t);
            setTimeout(()=>t.remove(), 3000);
        }

        // Funcion para quitar acentos
        function removeAccents(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function switchView(v) {
            document.querySelectorAll('.view-section').forEach(e=>e.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
            document.getElementById('view-'+v).classList.add('active');
            document.getElementById('nav-'+v).classList.add('active');
            
            if(v === 'pos') document.getElementById('pos-input').focus();
            if(v === 'inventory') renderInventory();
            if(v === 'reports') renderReports();
        }

        // --- INVENTARIO ---
        document.getElementById('inventory-form').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('prod-name').value.trim();
            const barcode = document.getElementById('prod-barcode').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value);
            const stock = parseInt(document.getElementById('prod-stock').value);

            if(inventory.some(p=>p.barcode===barcode)) return showToast('Codigo duplicado', 'error');

            inventory.push({ id:Date.now(), name, barcode, price, stock });
            saveGlobalData();
            renderInventory();
            e.target.reset();
            showToast('Guardado');
        };

        function renderInventory() {
            const tb = document.querySelector('#inventory-table tbody');
            const search = document.getElementById('inv-search').value.toLowerCase();
            tb.innerHTML = '';
            
            const filtered = inventory.filter(p => p.name.toLowerCase().includes(search) || p.barcode.includes(search));

            filtered.forEach(p => {
                tb.innerHTML += `
                    <tr>
                        <td>${p.name}</td><td>${p.barcode}</td><td>${p.price.toFixed(2)}</td>
                        <td style="color:${p.stock<5?'red':'green'}">${p.stock}</td>
                        <td><button onclick="delProd(${p.id})" class="btn-danger" style="padding:5px 10px; font-size:0.8rem;">X</button></td>
                    </tr>`;
            });
        }

        function delProd(id) {
            if(confirm('Borrar?')) { inventory = inventory.filter(p=>p.id!==id); saveGlobalData(); renderInventory(); }
        }

        // --- CAJA (POS) ---
        const posInput = document.getElementById('pos-input');
        const dropdown = document.getElementById('pos-dropdown');

        posInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            dropdown.innerHTML = '';
            if(val.length === 0) { dropdown.style.display='none'; return; }

            const matches = inventory.filter(p => p.name.toLowerCase().includes(val) || p.barcode.includes(val));
            if(matches.length > 0) {
                matches.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'dropdown-item';
                    li.innerHTML = `<span>${p.name}</span><span>$${p.price}</span>`;
                    li.onclick = () => { addToCart(p); posInput.value=''; dropdown.style.display='none'; };
                    dropdown.appendChild(li);
                });
                dropdown.style.display = 'block';
            } else { dropdown.style.display='none'; }
        });

        posInput.onkeydown = (e) => {
            if(e.key === 'Enter') {
                dropdown.style.display='none';
                const val = posInput.value.trim();
                let p = inventory.find(x => x.barcode === val);
                if(!p) p = inventory.find(x => x.name.toLowerCase() === val.toLowerCase());
                if(p) { addToCart(p); posInput.value=''; } 
                else if(val) showToast('No encontrado', 'error');
            }
        };

        function addToCart(p) {
            const exist = cart.find(c => c.id === p.id);
            if(exist) {
                if(exist.qty < p.stock) exist.qty++; else showToast('Sin stock', 'error');
            } else {
                if(p.stock > 0) cart.push({...p, qty:1}); else showToast('Sin stock', 'error');
            }
            renderCart();
        }

        function renderCart() {
            const tb = document.getElementById('cart-body');
            const empty = document.getElementById('empty-cart-msg');
            tb.innerHTML = '';
            let total = 0;
            
            if(cart.length===0) { empty.style.display='block'; document.getElementById('pos-total').innerText='$0.00'; return; }
            empty.style.display='none';

            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                tb.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.qty}</td>
                        <td>${(item.price*item.qty).toFixed(2)}</td>
                        <td><span onclick="cart.splice(${idx},1);renderCart()" style="color:red;font-size:1.2rem;">&times;</span></td>
                    </tr>`;
            });
            document.getElementById('pos-total').innerText = '$' + total.toFixed(2);
        }

        function processSale() {
            if(cart.length===0) return showToast('Carrito vacio', 'error');
            let total=0;
            
            // Guardamos el detalle de productos vendidos en este momento
            const itemsSnapshot = cart.map(c => ({
                name: c.name,
                qty: c.qty,
                price: c.price,
                subtotal: c.price * c.qty
            }));

            cart.forEach(c => {
                total += c.price * c.qty;
                const prod = inventory.find(p=>p.id===c.id);
                if(prod) prod.stock -= c.qty;
            });

            // Guardamos la venta con el detalle
            salesHistory.push({ 
                id:Date.now(), 
                date:new Date().toISOString(), 
                total:total,
                items: itemsSnapshot 
            });
            
            saveGlobalData();
            showToast('Venta realizada');
            clearCart();
        }

        function clearCart() { cart=[]; renderCart(); }

        // --- ESCANER ---
        function startScanner(ctx) {
            scanContext = ctx;
            document.getElementById('scanner-modal').style.display = 'flex';
            if(html5QrCode) html5QrCode.clear().then(initScanner).catch(()=>initScanner);
            else initScanner();
        }

        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess)
            .catch(err => { showToast("Error camara", 'error'); stopScanner(); });
        }

        function stopScanner() {
            document.getElementById('scanner-modal').style.display = 'none';
            if(html5QrCode) html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{});
        }

        function onScanSuccess(code) {
            stopScanner();
            if(scanContext === 'inventory') {
                document.getElementById('prod-barcode').value = code;
                showToast('Codigo capturado');
            } else {
                let p = inventory.find(x => x.barcode === code);
                if(p) { addToCart(p); showToast('Agregado'); } else showToast('No encontrado', 'error');
            }
        }

        // --- REPORTES CON FILTROS Y DETALLE ---
        function getFilteredSales() {
            const type = document.getElementById('report-type').value;
            const now = new Date();
            
            return salesHistory.filter(s => {
                const sDate = new Date(s.date);
                if (type === 'today') {
                    return s.date.split('T')[0] === now.toISOString().split('T')[0];
                } else if (type === 'week') {
                    const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return sDate >= oneWeekAgo;
                } else if (type === 'month') {
                    return sDate.getMonth() === now.getMonth() && sDate.getFullYear() === now.getFullYear();
                } else if (type === 'year') {
                    return sDate.getFullYear() === now.getFullYear();
                }
                return false;
            });
        }

        function renderReports() {
            const type = document.getElementById('report-type').value;
            const filtered = getFilteredSales();
            
            let label = "";
            if(type === 'today') label = "Hoy";
            if(type === 'week') label = "Ultima Semana";
            if(type === 'month') label = new Date().toLocaleString('es-ES', { month: 'long', year: 'numeric' });
            if(type === 'year') label = new Date().getFullYear();

            document.getElementById('report-date').innerText = label.toUpperCase();
            document.getElementById('report-count').innerText = filtered.length;
            document.getElementById('report-total').innerText = '$' + filtered.reduce((sum, s)=>sum+s.total, 0).toFixed(2);
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const type = document.getElementById('report-type').value;
            const filteredSales = getFilteredSales();
            
            let label = "Corte ";
            if(type === 'today') label += "Diario";
            if(type === 'week') label += "Semanal";
            if(type === 'month') label += "Mensual";
            if(type === 'year') label += "Anual";

            const totalAmount = filteredSales.reduce((sum, s)=>sum+s.total, 0);

            let yPos = 20;
            const leftMargin = 10;
            const lineHeight = 8;

            // Titulo
            doc.setFontSize(18);
            doc.text(removeAccents("Abarrotes V&V - " + label), leftMargin, yPos);
            yPos += 15;

            // Fecha
            doc.setFontSize(12);
            doc.text("Fecha: " + new Date().toLocaleDateString('es-ES'), leftMargin, yPos);
            yPos += 10;

            // Resumen
            doc.setFontSize(14);
            doc.text(removeAccents("Ventas: ") + filteredSales.length, leftMargin, yPos);
            yPos += 8;
            doc.text(removeAccents("Total Recaudado: $") + totalAmount.toFixed(2), leftMargin, yPos);
            yPos += 15;

            doc.setLineWidth(0.5);
            doc.line(leftMargin, yPos, 200, yPos);
            yPos += 10;

            // Detalle de Ventas
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.text("Detalle de Transacciones:", leftMargin, yPos);
            yPos += 10;
            doc.setFont("helvetica", "normal");

            if(filteredSales.length === 0) {
                doc.text("No hay ventas en este periodo.", leftMargin, yPos);
            } else {
                filteredSales.forEach((sale) => {
                    // Verificar salto de pagina
                    if(yPos > 260) {
                        doc.addPage();
                        yPos = 20;
                    }

                    const dateObj = new Date(sale.date);
                    const dateStr = dateObj.toLocaleDateString('es-ES');
                    const timeStr = dateObj.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'});

                    // Cabecera de venta
                    doc.setFont("helvetica", "bold");
                    doc.text(`Fecha: ${dateStr} - Hora: ${timeStr} - Total: $${sale.total.toFixed(2)}`, leftMargin, yPos);
                    yPos += lineHeight;
                    doc.setFont("helvetica", "normal");

                    // Productos
                    if(sale.items && sale.items.length > 0) {
                        sale.items.forEach(item => {
                            if(yPos > 270) { doc.addPage(); yPos = 20; }
                            // " - NombreProducto x2 ... $XX.XX"
                            const itemText = `- ${removeAccents(item.name)} x${item.qty} ... $${item.subtotal.toFixed(2)}`;
                            doc.text(itemText, leftMargin + 5, yPos);
                            yPos += lineHeight;
                        });
                    }
                    yPos += 5; // Espacio entre ventas
                });
            }

            doc.save("Reporte_" + label + ".pdf");
            showToast("PDF Generado");
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#pos-input') && !e.target.closest('#pos-dropdown')) {
