<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abarrotes V&V</title>
    <!-- Libreria para leer Codigos de Barras con Camara -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --bg-color: #064e3b;
            --text-color: #86efac;
            --card-bg: #065f46;
            --input-bg: #ffffff;
            --input-text: #000000;
            --btn-primary: #4ade80;
            --btn-primary-text: #064e3b;
            --btn-danger: #ef4444;
            --border-color: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Verdana', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 2rem;
            font-size: 18px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 1.5rem 1rem;
            background-color: var(--card-bg);
            border-bottom: 4px solid var(--text-color);
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            border-bottom: 2px dashed var(--text-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.2rem;
            background-color: var(--input-bg);
            color: var(--input-text);
            margin-bottom: 1rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1.2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background-color: var(--btn-primary);
            color: var(--btn-primary-text);
        }

        .btn-camera {
            background-color: #3b82f6;
            color: white;
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .btn-success {
            background-color: var(--btn-primary);
            color: var(--bg-color);
            font-size: 1.8rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .btn-danger { background-color: var(--btn-danger); color: white; }

        .table-container { overflow-x: auto; background: #fff; border-radius: 15px; padding: 0.5rem; }
        table { width: 100%; border-collapse: collapse; color: #000; }
        th { background-color: #a7f3d0; padding: 1rem; text-align: left; }
        td { padding: 0.8rem; border-bottom: 1px solid #ccc; }

        /* ESTILOS DEL ESCANER */
        #scanner-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        #scanner-controls {
            margin-top: 1rem;
            width: 90%;
            max-width: 500px;
            display: flex;
            gap: 1rem;
        }

        .total-display {
            background: #fff;
            color: #000;
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            border: 5px solid var(--text-color);
            margin-bottom: 1rem;
        }
        .total-amount { font-size: 3.5rem; font-weight: 900; color: var(--bg-color); line-height: 1; }

        /* Notificaciones */
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 3000;
            width: 90%; max-width: 300px;
        }
        .toast {
            background: #fff; color: #000; padding: 1rem;
            border-radius: 10px; margin-bottom: 10px;
            border-left: 8px solid var(--btn-primary);
            font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .toast.error { border-left-color: var(--btn-danger); }

        .row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .col { flex: 1; min-width: 250px; }

    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- MODAL DE CAMARA -->
    <div id="scanner-modal">
        <div id="reader"></div>
        <div id="scanner-controls">
            <button onclick="stopScanner()" class="btn btn-danger">X Cerrar Camara</button>
        </div>
        <p style="color:white; margin-top:1rem;">Apunta al codigo de barras</p>
    </div>

    <header>
        <h1>Abarrotes V&V</h1>
        <nav>
            <button onclick="switchView('inventory')" id="nav-inventory" class="nav-btn">Productos</button>
            <button onclick="switchView('pos')" id="nav-pos" class="nav-btn active">Vender</button>
            <button onclick="switchView('reports')" id="nav-reports" class="nav-btn">Corte</button>
        </nav>
    </header>

    <main>
        <!-- VISTA INVENTARIO -->
        <section id="view-inventory" class="view-section">
            <div class="card">
                <h2>Agregar Producto</h2>
                <form id="inventory-form">
                    <div class="row">
                        <div class="col"><label>Nombre</label><input type="text" id="prod-name" placeholder="Ej. Jabon" required></div>
                        <div class="col"><label>Codigo</label><input type="text" id="prod-barcode" placeholder="Escanear o escribir" required></div>
                    </div>
                    <div class="row">
                        <div class="col"><label>Precio</label><input type="number" id="prod-price" step="0.01" placeholder="0.00" required></div>
                        <div class="col"><label>Stock</label><input type="number" id="prod-stock" placeholder="0" required></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </form>
            </div>
            <div class="card">
                <div class="table-container">
                    <table id="inventory-table">
                        <thead><tr><th>Producto</th><th>Codigo</th><th>Precio</th><th>Stock</th><th>Acción</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- VISTA CAJA -->
        <section id="view-pos" class="view-section active">
            <div class="row">
                <div class="col" style="flex: 2;">
                    <div class="card">
                        <h2>Escanear</h2>
                        <!-- Boton para abrir camara -->
                        <button onclick="startScanner()" class="btn btn-camera">Camara del Celular</button>
                        
                        <label>O escribir codigo/nombre:</label>
                        <input type="text" id="pos-input" placeholder="Codigo o nombre..." autofocus autocomplete="off">
                    </div>

                    <div class="card">
                        <h2>Carrito</h2>
                        <div class="table-container">
                            <table id="cart-table">
                                <thead><tr><th>Producto</th><th>Cant.</th><th>Total</th><th></th></tr></thead>
                                <tbody id="cart-body"></tbody>
                            </table>
                            <div id="empty-cart-msg" style="text-align:center; padding:2rem;">Vacio</div>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="total-display">
                        <span style="font-size:1.5rem;">TOTAL</span>
                        <div class="total-amount" id="pos-total">$0.00</div>
                    </div>
                    <button onclick="processSale()" class="btn btn-success">COBRAR</button>
                    <button onclick="clearCart()" class="btn btn-danger">Cancelar</button>
                </div>
            </div>
        </section>

        <!-- VISTA REPORTES -->
        <section id="view-reports" class="view-section">
            <div class="card" style="text-align:center;">
                <h2>Corte de Hoy</h2>
                <p id="report-date" style="margin-bottom:1rem;"></p>
                <div style="background:#fff; padding:2rem; border-radius:20px; color:#000;">
                    <div>Ventas Totales: <span id="report-count" style="font-size:2rem;">0</span></div>
                    <div style="margin-top:1rem; font-size:3rem; color:#064e3b;" id="report-total">$0.00</div>
                </div>
                <button onclick="renderReports()" class="btn btn-primary">Actualizar</button>
            </div>
        </section>
    </main>

    <script>
        // --- VARIABLES GLOBALES ---
        let inventory = JSON.parse(localStorage.getItem('vv_inventory')) || [];
        let salesHistory = JSON.parse(localStorage.getItem('vv_sales')) || [];
        let cart = [];
        let html5QrCode;

        // Datos iniciales de prueba
        if (inventory.length === 0) {
            inventory = [
                { id: 1, name: 'Coca Cola 600ml', barcode: '750100', price: 20.00, stock: 24 },
                { id: 2, name: 'Galletas Marias', barcode: '750200', price: 12.50, stock: 50 }
            ];
            saveData();
        }

        function saveData() {
            localStorage.setItem('vv_inventory', JSON.stringify(inventory));
            localStorage.setItem('vv_sales', JSON.stringify(salesHistory));
        }

        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`; t.innerText = msg;
            c.appendChild(t);
            setTimeout(()=>t.remove(), 3000);
        }

        // --- NAVEGACION ---
        function switchView(v) {
            document.querySelectorAll('.view-section').forEach(e=>e.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
            document.getElementById('view-'+v).classList.add('active');
            document.getElementById('nav-'+v).classList.add('active');
            
            if(v === 'pos') document.getElementById('pos-input').focus();
            if(v === 'reports') renderReports();
            if(v === 'inventory') renderInventory();
        }

        // --- LOGICA INVENTARIO ---
        document.getElementById('inventory-form').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('prod-name').value.trim();
            const barcode = document.getElementById('prod-barcode').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value);
            const stock = parseInt(document.getElementById('prod-stock').value);

            if(inventory.some(p=>p.barcode===barcode)) return showToast('Codigo duplicado', 'error');

            inventory.push({ id:Date.now(), name, barcode, price, stock });
            saveData();
            renderInventory();
            e.target.reset();
            showToast('Guardado');
        };

        function renderInventory() {
            const tb = document.querySelector('#inventory-table tbody');
            tb.innerHTML = '';
            inventory.forEach(p => {
                tb.innerHTML += `
                    <tr>
                        <td>${p.name}</td><td>${p.barcode}</td><td>$${p.price.toFixed(2)}</td>
                        <td class="${p.stock<5?'red':'green'}" style="color:${p.stock<5?'red':'green'}">${p.stock}</td>
                        <td><button onclick="delProd(${p.id})" class="btn btn-danger" style="padding:0.5rem; font-size:0.8rem;">X</button></td>
                    </tr>`;
            });
        }
        function delProd(id) {
            if(confirm('¿Borrar?')) { inventory = inventory.filter(p=>p.id!==id); saveData(); renderInventory(); }
        }

        // --- LOGICA CAMARA / ESCANER ---
        function startScanner() {
            const modal = document.getElementById('scanner-modal');
            modal.style.display = 'flex';
            
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            // Preferimos la camara trasera ("environment")
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                showToast("Error al abrir camara: " + err, 'error');
                stopScanner();
            });
        }

        function stopScanner() {
            const modal = document.getElementById('scanner-modal');
            modal.style.display = 'none';
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => console.error("Error al detener", err));
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Codigo detectado
            stopScanner(); // Cerrar camara automaticamente
            processSearch(decodedText);
        }

        // --- LOGICA VENTA ---
        const posInput = document.getElementById('pos-input');
        posInput.onkeydown = (e) => {
            if(e.key === 'Enter') {
                e.preventDefault();
                processSearch(posInput.value.trim());
                posInput.value = '';
            }
        };

        function processSearch(query) {
            let p = inventory.find(x => x.barcode === query);
            if(!p) p = inventory.find(x => x.name.toLowerCase().includes(query.toLowerCase()));
            
            if(p) addToCart(p);
            else showToast('Producto no encontrado', 'error');
        }

        function addToCart(p) {
            const exist = cart.find(c => c.id === p.id);
            const qty = exist ? exist.qty : 0;
            if(p.stock <= qty) return showToast('Sin stock', 'error');

            if(exist) exist.qty++;
            else cart.push({...p, qty:1});
            renderCart();
            showToast('Agregado');
        }

        function renderCart() {
            const tb = document.getElementById('cart-body');
            const empty = document.getElementById('empty-cart-msg');
            const totalEl = document.getElementById('pos-total');
            tb.innerHTML = '';
            let total = 0;
            
            if(cart.length===0) { empty.style.display='block'; totalEl.innerText='$0.00'; return; }
            empty.style.display='none';

            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                tb.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.qty}</td>
                        <td>$${(item.price*item.qty).toFixed(2)}</td>
                        <td><button onclick="cart.splice(${idx},1);renderCart()" style="color:red;border:none;background:none;font-size:1.5rem;">&times;</button></td>
                    </tr>`;
            });
            totalEl.innerText = '$' + total.toFixed(2);
        }

        function clearCart() { cart=[]; renderCart(); }
        
        function processSale() {
            if(cart.length===0) return showToast('Carrito vacio', 'error');
            let total=0;
            cart.forEach(c => {
                total += c.price * c.qty;
                const prod = inventory.find(p=>p.id===c.id);
                if(prod) prod.stock -= c.qty;
            });
            salesHistory.push({ id:Date.now(), date:new Date().toISOString(), total:total });
            saveData();
            showToast('Venta realizada');
            clearCart();
        }

        // --- REPORTES ---
        function renderReports() {
            const todayStr = new Date().toISOString().split('T')[0];
            const todaySales = salesHistory.filter(s => s.date.startsWith(todayStr));
            document.getElementById('report-date').innerText = new Date().toLocaleDateString('es-ES');
            document.getElementById('report-count').innerText = todaySales.length;
            const total = todaySales.reduce((sum, s) => sum + s.total, 0);
            document.getElementById('report-total').innerText = '$' + total.toFixed(2);
        }

        renderInventory();
    </script>
</body>
</html>
